services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: StarMotors
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend-sql:
    build: ./StarMotors_backend_sql
    depends_on:
      - postgres
    environment:
      PORT: 9898
      DB_URL: jdbc:postgresql://postgres:5432/StarMotors
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "9898:9898"
    restart: on-failure

  backend-nosql:
    build: ./StarMotors_backend_no_sql
    depends_on:
      - mongo
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/StarMotors
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build: ./StarMotors_Front_end
    depends_on:
      - backend-sql
      - backend-nosql
    ports:
      - "4200:80"

volumes:
  postgres-data:
  mongo-data:
