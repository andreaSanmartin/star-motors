server.port=${PORT:9898}

#POSTGRES
#spring.datasource.initialization-mode=always
spring.datasource.initialize=true

#CREDENCIALES. Configurar con variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/StarMotors}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

#MOSTRAR SENTENCIAS SQL EN LA CONSOLA
spring.jpa.hibernate.show-sql=true

#ACTUALIZAR BASE DE DATOS Y CREAR ENTIDADES
spring.jpa.hibernate.ddl-auto=update

#HIBERNATE GENERA SQL OPTIMIZADO
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
